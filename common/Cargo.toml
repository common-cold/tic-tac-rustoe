[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
serde = "1.0.228"
sqlx = {version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "tls-native-tls"]}
tokio = "1.48.0"
uuid = { version = "1", features = ["serde", "v4"] }
jsonwebtoken = {version = "10.2.0", features = ["rust_crypto"]}
chrono = "0.4.42"
serde_json = "1.0.145"
